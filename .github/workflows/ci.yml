name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  server-tests:
    name: 后端测试 + 安全扫描
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pwd
          MYSQL_DATABASE: party_school
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot -pci_root_pwd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_pwd
      DB_NAME: party_school
      JWT_SECRET: ci-only-test-secret-not-for-production
      SEED_PASSWORD: ci-seed-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 执行幂等数据库迁移
        run: node init-db.js
      - name: 运行后端测试
        run: npm test
      - name: 生产依赖安全门禁（高危及以上阻断合并）
        run: npm audit --omit=dev --audit-level=high
      - name: 全量依赖风险报告（含开发依赖，仅提示不阻断）
        run: npm audit --audit-level=high || true

  admin-build:
    name: 管理后台构建 + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - name: 生产依赖安全门禁（高危及以上阻断合并）
        run: npm audit --omit=dev --audit-level=high
      - name: 全量依赖风险报告（含开发依赖，仅提示不阻断）
        run: npm audit --audit-level=high || true
      - run: npm run build

  mobile-build:
    name: 党员端构建 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: 生产依赖安全门禁（高危及以上阻断合并）
        run: npm audit --omit=dev --audit-level=high
      - name: 全量依赖风险报告（含开发依赖，仅提示不阻断）
        run: npm audit --audit-level=high || true
      - run: npm run build

  docker-integration:
    name: Docker 集成测试（构建/健康/隔离/持久化）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IT_DB_PASSWORD: it-only-root-pwd-2026
      IT_SEED_PASSWORD: it-seed-pwd-2026-strong
      IT_JWT_SECRET: it-only-jwt-secret-not-for-production
      IT_RUN_ID: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: 运行 Docker 集成测试（独立项目名+临时卷，结束自动清理）
        run: bash deploy/docker-integration-test.sh

  e2e-smoke:
    name: E2E 冒烟测试（真实浏览器核心链路）
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # 一次性隔离测试环境凭据（独立卷，栈销毁即失效），非生产凭据
      E2E_DB_PASSWORD: e2e-db-pass-2026
      E2E_SEED_PASSWORD: e2e-seed-pass-2026
      E2E_JWT_SECRET: e2e-only-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: 安装依赖与浏览器
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 运行 E2E 冒烟（自动拉起隔离 Docker 栈，结束销毁全部临时卷）
        working-directory: e2e
        run: npm run test:smoke
      - name: 上传失败工件（截图/trace/报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: 凭据安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查常见明文凭据是否被提交
        run: |
          if grep -rInE '(password|secret|token)[[:space:]]*[:=][[:space:]]*["'"'"'][0-9A-Za-z_-]{6,}' \
              --include='*.js' --include='*.json' --include='*.env' \
              --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "检测到疑似明文凭据，请检查上述文件"
            exit 1
          fi
