server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 代理公共头（未被 location 覆盖时向下游继承）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 健康探针（精确匹配重写到后端根路径，供外部探活）
    location = /api/health {
        proxy_pass http://server:3001/health;
    }
    location = /api/health/ready {
        proxy_pass http://server:3001/health/ready;
    }
    # 注意：/metrics 仅限容器网络内部采集（docker compose exec server wget 等），
    # 不在此映射，避免运行指标对外暴露。

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://server:3001;
        proxy_read_timeout 120s; # AI 接口可能长时间流式响应
    }

    # 上传文件走后端静态服务
    location /uploads/ {
        proxy_pass http://server:3001;
    }

    # history 路由：前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
